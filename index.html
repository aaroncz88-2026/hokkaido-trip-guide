<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f6f68" />
    <meta name="description" content="2026 年北海道亲子自驾手机攻略" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="北海道攻略" />
    <title>夏日北行 · 北海道亲子攻略</title>
    <script>
      // Clear broken service workers quietly; do not change visible UI.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister() }))
            }).catch(function () {})
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(
                keys
                  .filter(function (key) { return key.indexOf('hokkaido-guide') === 0 })
                  .map(function (key) { return caches.delete(key) }),
              )
            }).catch(function () {})
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
