<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6b4d78" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="description" content="2026 年北海道亲子自驾手机攻略" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="北海道攻略" />
    <title>夏日北行 · 北海道亲子攻略</title>
    <script>
      // Force one reload after each published shell so phones drop sticky parking caches.
      (function () {
        var BUILD = '2026-08-21-day5-guide-v55'
        var KEY = 'hokkaido-shell-build-v2'
        try {
          var url = new URL(location.href)
          var alreadyBusted = url.searchParams.get('shell') === BUILD
          var prev = null
          try { prev = localStorage.getItem(KEY) } catch (e) {}
          try {
            localStorage.removeItem('hokkaido-shell-build')
          } catch (e) {}
          var tasks = []
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister() }))
              }),
            )
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key) }))
              }),
            )
          }
          Promise.all(tasks).catch(function () {}).finally(function () {
            if (prev === BUILD || alreadyBusted) {
              try { localStorage.setItem(KEY, BUILD) } catch (e) {}
              return
            }
            try { localStorage.setItem(KEY, BUILD) } catch (e) {}
            url.searchParams.set('shell', BUILD)
            location.replace(url.toString())
          })
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
