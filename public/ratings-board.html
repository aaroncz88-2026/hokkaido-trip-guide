<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北海道评分后台</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <style>
      :root {
        --brand: #6b4d78;
        --ink: #2a2430;
        --muted: #7a7080;
        --paper: #fffbfd;
        --bg: #f4f0f6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        padding: 22px 20px 12px;
        background: linear-gradient(180deg, #6b4d78, #8a6a97);
        color: #fff;
      }
      header small { opacity: 0.78; letter-spacing: 0.08em; }
      header h1 { margin: 6px 0 4px; font-size: 1.45rem; }
      header p { margin: 0; opacity: 0.88; font-size: 0.92rem; }
      main { width: min(920px, calc(100% - 28px)); margin: 16px auto 32px; }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      button {
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      #fixOnion { background: #b42318; }
      .stat {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .grid { display: grid; gap: 12px; }
      article {
        padding: 14px 16px;
        border: 1px solid #e4dce6;
        border-radius: 16px;
        background: var(--paper);
      }
      article header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 0;
        background: none;
        color: inherit;
      }
      article h2 { margin: 0; font-size: 1.05rem; }
      article .meta { color: var(--muted); font-size: 0.78rem; }
      .stars { color: var(--brand); font-weight: 800; }
      ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
      li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(140, 104, 158, 0.08);
      }
      li small { grid-column: 1 / -1; color: var(--muted); }
      .empty, .err { color: var(--muted); line-height: 1.5; }
      .err { color: #b42318; }
    </style>
  </head>
  <body>
    <header>
      <small>BACKSTAGE · HOKKAIDO 2026</small>
      <h1>评分后台</h1>
      <p>全员打分实时汇总 · 按景点 / 按昵称</p>
    </header>
    <main>
      <div class="toolbar">
        <button id="reload" type="button">刷新云端</button>
        <button id="fixOnion" type="button">清空洋葱 DAY1</button>
        <span class="stat" id="stat">正在读取…</span>
      </div>
      <div class="grid" id="board"></div>
    </main>
    <script>
      const PROJECT = 'hokkaido-trip-guide'
      const TITLES = {
        'day1-shikotsu-lake': 'DAY1 · 支笏湖',
        'day1-dinner-genbee': 'DAY1 · 晚餐 · 源べえ',
        'day2-rusutsu-park': 'DAY2 · 留寿都游乐园',
        'day2-lunch': 'DAY2 · 午餐',
        'day2-dinner-kakashi': 'DAY2 · 晚餐 · かかし',
        'day2-night-play': 'DAY2 · 晚上的游乐区',
        'day3-breakfast-oktoberfest': 'DAY3 · 早餐 · Oktoberfest',
        'day3-usuzan': 'DAY3 · 有珠山',
        'day3-lake-hill-farm': 'DAY3 · 下午茶 · Lake Hill Farm',
        'day3-toya-area': 'DAY3 · 洞爷湖区域',
        'day3-dinner-karzz': 'DAY3 · 晚餐 · KARZZ',
        'day4-sapporo-hotel': 'DAY4 · 酒店 · 札幌公寓',
        'day4-jozankei': 'DAY4 · 定山溪',
        'day4-lunch': 'DAY4 · 午餐 · 食堂いち',
        'day4-shiroi-koibito': 'DAY4 · 白色恋人公园',
        'day4-dinner-gaja': 'DAY4 · 晚餐 · GAjA',
        'day4-night-market': 'DAY4 · 夜市 · 狸小路',
        'day5-blue-pond': 'DAY5 · 青池',
        'day5-shirahige': 'DAY5 · 白须瀑布',
        'day5-shikisai': 'DAY5 · 四季彩之丘',
        'day5-lunch': 'DAY5 · 午餐 · フロックスホール',
        'day5-tomita': 'DAY5 · 富田农场',
        'day5-ningle': 'DAY5 · 精灵露台',
        'day5-dinner-kumagera': 'DAY5 · 晚餐 · くまげら',
        'day6-ryugu': 'DAY6 · 龙宫',
        'day6-lunch': 'DAY6 · 午餐',
        'day6-otaru-canal-market': 'DAY6 · 小樽运河和市集',
        'day6-dinner': 'DAY6 · 晚餐',
      }

      const decode = (value) => {
        if (!value) return undefined
        if ('stringValue' in value) return value.stringValue
        if ('integerValue' in value) return Number(value.integerValue)
        if ('doubleValue' in value) return value.doubleValue
        if ('booleanValue' in value) return value.booleanValue
        if ('mapValue' in value) {
          const fields = value.mapValue.fields || {}
          return Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, decode(v)]))
        }
        return undefined
      }

      const findKey = async () => {
        const html = await (await fetch('./')).text()
        const match = html.match(/assets\/([^"']+\.js)/)
        if (!match) throw new Error('找不到前端脚本')
        const js = await (await fetch('./assets/' + match[1])).text()
        const key = (js.match(/AIza[0-9A-Za-z\-_]{20,}/) || [])[0]
        if (!key) throw new Error('找不到云端密钥')
        return key
      }

      const load = async () => {
        const stat = document.getElementById('stat')
        const board = document.getElementById('board')
        stat.textContent = '正在读取云端…'
        board.innerHTML = ''
        try {
          const key = await findKey()
          const url = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/tripRatings?key=${encodeURIComponent(key)}`
          const res = await fetch(url)
          const data = await res.json()
          if (!res.ok) throw new Error(data.error?.message || `读取失败 ${res.status}`)
          const rows = (data.documents || []).map((doc) => {
            const f = doc.fields || {}
            const scores = decode(f.scores) || {}
            const rawStars = Number(decode(f.stars) || 0)
            const overall = Number(scores.overall || 0)
            const score10 = Number(decode(f.score10) || 0)
            const name = String(decode(f.travelerName) || '?')
            const comment = String(decode(f.comment) || '')
            if (name === '__deleted__' || comment === '__deleted__') return null
            return {
              name,
              targetId: String(decode(f.targetId) || '?'),
              stars: score10 || overall || rawStars,
              rawStars,
              comment,
              updatedAt: String(decode(f.updatedAt) || ''),
            }
          }).filter(Boolean).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))

          const looksLikeOldFive = rows.length > 0 && rows.every((r) => r.rawStars > 0 && r.rawStars <= 5 && r.rawStars === r.stars)
          stat.textContent = rows.length
            ? `云端共 ${rows.length} 条${looksLikeOldFive ? ' · 这些还是旧的 5 星记录，8/9 没写进去' : ''}`
            : '云端还没有评分'
          if (rows.length === 0) {
            board.innerHTML = '<p class="empty">还没有人提交。手机打分并提示「已同步到云端」后，再点刷新。</p>'
            return
          }

          const bySpot = {}
          for (const row of rows) {
            if (!bySpot[row.targetId]) bySpot[row.targetId] = []
            bySpot[row.targetId].push(row)
          }

          board.innerHTML = Object.entries(bySpot).map(([id, list]) => {
            const avg = Math.round((list.reduce((s, r) => s + r.stars, 0) / list.length) * 10) / 10
            const title = TITLES[id] || id
            const people = list.map((r) => `
              <li>
                <strong>${r.name}</strong>
                <span class="stars">${r.stars} / 10</span>
                ${r.comment ? `<small>${r.comment}</small>` : ''}
              </li>
            `).join('')
            return `
              <article>
                <header>
                  <div>
                    <div class="meta">${id}</div>
                    <h2>${title}</h2>
                  </div>
                  <span class="stars">均 ${avg}★ · ${list.length} 人</span>
                </header>
                <ul>${people}</ul>
              </article>
            `
          }).join('')
        } catch (error) {
          stat.textContent = '读取失败'
          board.innerHTML = `<p class="err">${error.message || error}</p>`
        }
      }

      const encodeString = (value) => ({ stringValue: String(value ?? '') })
      const encodeNumber = (value) => ({ integerValue: String(Math.round(Number(value) || 0)) })

      const fixOnion = async () => {
        const stat = document.getElementById('stat')
        stat.textContent = '正在清空洋葱的 DAY1…'
        try {
          const key = await findKey()
          const listUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/tripRatings?key=${encodeURIComponent(key)}`
          const listRes = await fetch(listUrl)
          const listData = await listRes.json()
          if (!listRes.ok) throw new Error(listData.error?.message || '读取失败')
          const wanted = new Set(['day1-shikotsu-lake', 'day1-dinner-genbee'])
          let updated = 0
          for (const doc of listData.documents || []) {
            const f = doc.fields || {}
            const name = String(decode(f.travelerName) || '')
            const targetId = String(decode(f.targetId) || '')
            if (name !== '洋葱' || !wanted.has(targetId)) continue
            const delRes = await fetch(`https://firestore.googleapis.com/v1/${doc.name}?key=${encodeURIComponent(key)}`, {
              method: 'DELETE',
            })
            if (delRes.ok || delRes.status === 404) {
              updated += 1
              continue
            }
            const body = {
              fields: {
                deviceId: f.deviceId || encodeString('onion-fix'),
                targetId: encodeString(targetId),
                travelerName: encodeString('__deleted__'),
                scores: { mapValue: { fields: { overall: encodeNumber(1) } } },
                stars: encodeNumber(1),
                score10: encodeNumber(1),
                comment: encodeString('__deleted__'),
                createdAt: f.createdAt || encodeString(new Date().toISOString()),
                updatedAt: encodeString(new Date().toISOString()),
              },
            }
            const patchRes = await fetch(`https://firestore.googleapis.com/v1/${doc.name}?key=${encodeURIComponent(key)}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            })
            const patchText = await patchRes.text()
            if (!patchRes.ok) throw new Error(`清空 ${targetId} 失败：${patchText.slice(0, 180)}`)
            updated += 1
          }
          if (!updated) throw new Error('没有找到洋葱的 DAY1 记录')
          stat.textContent = `已清空 ${updated} 条，正在刷新…`
          await load()
        } catch (error) {
          stat.textContent = error.message || String(error)
        }
      }

      document.getElementById('reload').addEventListener('click', load)
      document.getElementById('fixOnion').addEventListener('click', fixOnion)
      load()
    </script>
  </body>
</html>
